appId: dev.desknest.app
productName: DeskNest
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  # M1 只出解压版；安装包在 M8（R20）加入。签名与图标写入暂不启用（D-12）。
  target:
    - target: dir
      arch: [x64]
    - target: zip
      arch: [x64]
  signAndEditExecutable: false
